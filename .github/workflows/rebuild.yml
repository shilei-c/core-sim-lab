name: Rebuild CORE static data

# 每 15 分钟自动生成最新数据、检查新成交并提交到 docs/，GitHub Pages 会自动发布更新。
# cron 使用 UTC：01/16/31/46 分触发，等价于每 15 分钟一次，且避开整点拥堵（GitHub 定时任务在整点容易排队延迟）
on:
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site data
        run: node build-static.js

      - name: Notify new CORE trade to WeChat
        continue-on-error: true   # 推送失败不阻断数据重建与提交
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: node notify-trade.js

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data/market-cache.json data/multicoin-cache.json data/ranking-cache.json data/live-ticker-cache.json data/trade-notify-state.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: rebuild static data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
